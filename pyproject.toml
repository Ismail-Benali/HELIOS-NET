[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-net"
version = "2.0.0b1"
description = "Pre-release, scope-bound attack surface management and network discovery framework"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ismail-Benali" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
helios = "cli.main:main"

[project.urls]
Homepage = "https://github.com/Ismail-Benali/HELIOS-NET"
Repository = "https://github.com/Ismail-Benali/HELIOS-NET"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*", "cli*", "engine*", "modules*", "config*"]
namespaces = true

[tool.setuptools.package-data]
config = ["*.yaml", "*.txt"]
"core.native" = ["*.exe", "*.dll", "*.so", "*.dylib"]

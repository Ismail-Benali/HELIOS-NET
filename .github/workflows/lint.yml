# .github/workflows/lint.yml
name: Lint

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python (Ruff + format check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check (lint)
        run: ruff check core/ engine/ modules/ cli/ tests/ build.py run_simulation.py tools/

      - name: Ruff format check
        run: ruff format --check core/ engine/ modules/ cli/ tests/ build.py run_simulation.py tools/

  go-lint:
    name: Go (gofmt + golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        moddir:
          - transport/goscan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.moddir }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.moddir }}/go.sum

      - name: gofmt check
        working-directory: ${{ matrix.moddir }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          working-directory: ${{ matrix.moddir }}
          args: --timeout=5m

  rust-lint:
    name: Rust (Clippy + format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: rustfmt check
        working-directory: rust-core
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        working-directory: rust-core
        run: cargo clippy --release --all-targets --all-features -- -D warnings

  c-lint:
    name: C (cppcheck + clang-tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install analyzers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cppcheck clang-tidy

      - name: cppcheck (core C sources)
        run: |
          cppcheck --enable=warning,style,performance,portability --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            transport/c_core/src transport/c_core/include transport/c_core/tests

      - name: clang-tidy (warnings as errors)
        run: |
          if clang-tidy transport/c_core/src/*.c transport/c_core/tests/*.c \
               -- -Itransport/c_core/include -std=c11 2>&1 | grep -qE 'error:|warning:'; then
            echo "clang-tidy reported issues"
            exit 1
          fi
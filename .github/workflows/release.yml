# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-artifacts:
    name: Build Polyglot Artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: transport/goscan/go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Code Signing Credentials (Windows)
        if: runner.os == 'Windows'
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.HELIOS_SIGN_PFX_B64 }}" ] && [ -n "${{ secrets.HELIOS_SIGN_PASSWORD }}" ]; then
            echo "HELIOS_SIGN_PFX_B64=${{ secrets.HELIOS_SIGN_PFX_B64 }}" >> "$GITHUB_ENV"
            echo "HELIOS_SIGN_PASSWORD=${{ secrets.HELIOS_SIGN_PASSWORD }}" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Code Signing Status
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            echo "[+] Authenticode signing credentials present (out-of-band)."
          else
            echo "[*] No signing secrets provided for this tag build; artifacts will remain unsigned (documented gap)."
          fi

      - name: Polyglot Build + Test Suites
        run: |
          python build.py --test --fuzz=10

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helios-net-${{ runner.os }}-${{ github.ref_name }}
          path: |
            transport/c_core/build/**
            transport/goscan/goscan*
            rust-core/target/release/*.so
            rust-core/target/release/*.dylib
            rust-core/target/release/*.dll
            rust-core/target/release/*.rlib
          if-no-files-found: warn
          retention-days: 14

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-${{ runner.os }}.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ runner.os }}-${{ github.ref_name }}
          path: sbom-${{ runner.os }}.cdx.json
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/**/*.so
            dist/**/*.dll
            dist/**/*.dylib
            dist/**/*.exe
            dist/**/goscan*
            dist/**/*.cdx.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: HELIOS-NET Binary Release & Container Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release-build:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: helios-net-linux-x64.tar.gz
            asset_name: helios-net-linux-x64.tar.gz
          - os: windows-latest
            artifact_name: helios-net-win-x64.zip
            asset_name: helios-net-win-x64.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Polyglot Build Script
        run: python build.py

      - name: Run Smoke Verification Tests
        run: python tests/smoke.py

      - name: Package Artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/helios-net-linux-x64.tar.gz *.py core/ engine/ modules/ transport/ rust-core/target/release/

      - name: Package Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path *.py, core, engine, modules, transport, rust-core\target\release -DestinationPath dist\helios-net-win-x64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  docker-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release-notes:
    name: Create GitHub Release with Exact Notes
    runs-on: ubuntu-latest
    needs: [release-build, docker-publish]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: HELIOS-NET v1.3.0 -- Strategic Pathfinding & Advanced Evasion Integration
          body: |
            **What's New:**
            - 🧠 **Rust A* Pathfinder Core:** تنفيذ محرك توجيه استراتيجي جديد يحسب "المسار الأكثر أماناً" بناءً على تسجيل مخاطر متعدد العوامل (EDR Presence, Firewall Levels, Honeypot Probability) بدلاً من المسافة فقط.
            - 🛡️ **Enhanced C Evasion Suite:** دمج تقنيات تخفي متقدمة (Sleep Masking, ETW Patching, AMSI Bypass) مع دعم كامل لاستدعاءات النظام غير المباشرة (Indirect Syscalls).
            - 🔄 **Standardized Communication (SEE & NDJSON):** توحيد كامل لمخرجات الأخطاء والنتائج بين جميع مكونات النظام (Python, Go, C, Rust) لضمان موثوقية دورة الاستخبارات المغلقة.
            - ⚙️ **CI/CD Stabilization:** تحسين خطوط أنابيب البناء الآلي، وإصلاح خطوات النشر، وضمان استقرار اختبارات الدخان (Smoke Tests) عبر الأنظمة المتعددة.
          draft: false
          prerelease: false
